<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#f7dfc2">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Pancake Plop! 🥞</title>
    <link rel="stylesheet" href="styles/main.css">
</head>

<body>
    <main id="game-shell">
        <div id="game-container">
            <div id="pixi-container" aria-label="Pancake Plop game"></div>

            <!-- Heads-up display -->
            <div id="hud">
                <div class="hud-pill" id="flip-counter">
                    <span class="hud-icon">🥞</span>
                    <span class="hud-value">Flips: 0</span>
                </div>

                <div class="hud-pill" id="level-indicator">
                    <span class="hud-icon">⭐</span>
                    <span class="hud-value">Level 1</span>
                </div>
            </div>

            <!-- Floating game message -->
            <div id="message" role="status" aria-live="polite"></div>

            <!-- Power / charge UI -->
            <div id="charge-ui" aria-hidden="true">
                <div class="charge-label">
                    <span>FLIP POWER</span>
                    <span id="charge-percent">0%</span>
                </div>

                <div class="charge-track">
                    <div id="charge-fill"></div>
                    <div class="charge-highlight"></div>
                </div>

                <div class="charge-hint">Release to flip!</div>
            </div>

            <!-- Start / end game screen -->
            <section id="ui-overlay" aria-label="Game menu">
                <div class="menu-card">
                    <div class="menu-pancake" aria-hidden="true">
                        <span>🥞</span>
                    </div>

                    <div class="menu-kicker">WELCOME TO THE KITCHEN</div>

                    <h1>Pancake<br><span>Plop!</span></h1>

                    <p class="menu-description">
                        Flip the pancake, dodge the kitchen chaos,
                        and land it perfectly on the plate.
                    </p>

                    <button id="startButton" type="button">
                        <span class="button-icon">🥞</span>
                        <span>Start Level</span>
                        <span class="button-arrow">→</span>
                    </button>

                    <div class="controls-hint">
                        <span class="control-dot">●</span>
                        Hold anywhere to charge
                        <span class="control-dot">●</span>
                        Release to flip
                    </div>
                </div>
            </section>
        </div>
    </main>

    <!-- Matter.js Physics Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

    <!-- PixiJS -->
    <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.3.2/dist/pixi.min.js"></script>

    <!-- Game Scripts -->
    <script src="js/config.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/physics.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/pancake.js"></script>
    <script src="js/obstacles.js"></script>
    <script src="js/environment.js"></script>
    <script src="js/input.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
